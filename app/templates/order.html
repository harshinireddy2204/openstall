{% extends "base.html" %}
{% block title %}Order {{ order.order_id }} · OpenStall{% endblock %}
{% block scripts %}
<script src="/static/checkout.js"></script>
<script>
  (async () => {
    const box = document.getElementById("order-live");
    const res = await fetch(`/api/orders/${box.dataset.order}`);
    if (res.ok) { const el = OpenStallCheckout.card(await res.json()); box.appendChild(el); OpenStallCheckout.track(box.dataset.order, el); }
  })();
  if (window.opener && !window.opener.closed) {
    try { window.opener.postMessage({ type: "openstall-order", order_id: {{ order.order_id|tojson }} }, location.origin); } catch (e) {}
    document.body.insertAdjacentHTML("afterbegin", '<div class="banner">Payment step finished. You can close this window.</div>');
    setTimeout(() => window.close(), 800);
  }
</script>
{% endblock %}
{% block content %}
<section class="narrow">
  <p class="eyebrow">Order {{ order.order_id }}</p>
  {% if error %}<p class="notice">{{ error }}</p>{% endif %}
  <div id="order-live" data-order="{{ order.order_id }}"></div>
  <p><a href="/orders">All my orders</a> · <a href="/s/{{ order.stall_id }}">Back to the stall</a></p>
</section>
{% endblock %}
